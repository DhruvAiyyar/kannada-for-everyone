<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kannada for Everyone</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffaf0;--card:#fff;--ink:#2a2118;--mute:#7a6a58;--red:#c8102e;--gold:#f2a900;--line:#eadfca;--ok:#1f8a4c;--bad:#c8102e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1610;--card:#262017;--ink:#f6ecdb;--mute:#b9a98f;--line:#3a3022;--red:#ff5a6e;--gold:#f2b632;--ok:#4cc57f;--bad:#ff6b7b}}
:root[data-theme="dark"]{--bg:#1b1610;--card:#262017;--ink:#f6ecdb;--mute:#b9a98f;--line:#3a3022;--red:#ff5a6e;--gold:#f2b632;--ok:#4cc57f;--bad:#ff6b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.5rem;margin:0}h1 span{color:var(--red)}
.sub{color:var(--mute);margin:2px 0 14px;font-size:.95rem}
.kn{font-family:"Noto Sans Kannada","Nirmala UI",Tunga,sans-serif}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;white-space:nowrap}
button.on{background:var(--red);color:#fff;border-color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.tip{background:var(--card);border-left:4px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.card .t{flex:1}
.card .k{font-size:1.4rem;font-weight:600}
.card .r{color:var(--red);font-weight:600}
.card .e{color:var(--mute);font-size:.92rem}
.ic{border-radius:50%;width:42px;height:42px;padding:0;font-size:1.1rem}
.ic.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.q .big{font-size:1.7rem;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;border-radius:12px;margin:8px 0}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.note{color:var(--mute);font-size:.85rem;margin-top:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1><span class="kn">ಕನ್ನಡ</span> for Everyone</h1><button id="th" aria-label="Toggle theme">◐</button></header>
<p class="sub">Practical Kannada for real situations. Tap 🔊 to hear it, ✓ to mark it learned.</p>
<div class="tabs"><button id="tL" class="on">Learn</button><button id="tQ">Quiz</button></div>
<div class="chips" id="chips" style="margin-top:8px"></div>
<div class="bar"><i id="pb"></i></div>
<div id="pt" class="sub" style="margin:0"></div>
<div id="learn"></div>
<div id="quiz" class="hide"></div>
<p class="note" id="vn"></p>
</div>
<script>
const D={
"Greetings":{i:"👋",tip:"Add “-ri” or “-ee” endings for respect. “Namaskara” works at any time of day.",p:[
["ನಮಸ್ಕಾರ","Namaskara","Hello"],["ಹೇಗಿದ್ದೀರಾ?","Hegiddira?","How are you?"],["ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ","Naanu chennagiddene","I am fine"],["ನಿಮ್ಮ ಹೆಸರೇನು?","Nimma hesarenu?","What is your name?"],["ನನ್ನ ಹೆಸರು …","Nanna hesaru …","My name is …"],["ಧನ್ಯವಾದಗಳು","Dhanyavadagalu","Thank you"],["ಕ್ಷಮಿಸಿ","Kshamisi","Sorry / Excuse me"]]},
"Shopping":{i:"🛒",tip:"Bargaining is normal in local markets, so keep it friendly and smile.",p:[
["ಇದು ಎಷ್ಟು?","Idu eshtu?","How much is this?"],["ತುಂಬಾ ದುಬಾರಿ","Tumba dubari","Too expensive"],["ಸ್ವಲ್ಪ ಕಡಿಮೆ ಮಾಡಿ","Svalpa kadime maadi","Please reduce a little"],["ಒಂದು ಕಿಲೋ ಕೊಡಿ","Ondu kilo kodi","Give me one kilo"],["ಇದು ಬೇಡ","Idu beda","I don't want this"],["ಚಿಲ್ಲರೆ ಇದೆಯಾ?","Chillare ideya?","Do you have change?"]]},
"Transport":{i:"🚌",tip:"For autos, say “meter haaki” first. In buses, the conductor says the fare.",p:[
["ಮೆಜೆಸ್ಟಿಕ್‌ಗೆ ಹೋಗಬೇಕು","Majestic-ge hogabeku","I need to go to Majestic"],["ಮೀಟರ್ ಹಾಕಿ","Meter haaki","Please use the meter"],["ಇಲ್ಲಿ ನಿಲ್ಲಿಸಿ","Illi nillisi","Stop here"],["ಬಸ್ ಯಾವಾಗ ಬರುತ್ತದೆ?","Bus yaavaga baruttade?","When does the bus come?"],["ನೇರವಾಗಿ ಹೋಗಿ","Neravaagi hogi","Go straight"],["ಬಲಕ್ಕೆ","Balakke","To the right"],["ಎಡಕ್ಕೆ","Edakke","To the left"]]},
"Healthcare":{i:"🩺",tip:"Learn “help” first. Pharmacies are called “medical shop” in everyday speech.",p:[
["ನನಗೆ ಸಹಾಯ ಬೇಕು","Nanage sahaya beku","I need help"],["ನನಗೆ ಜ್ವರ ಇದೆ","Nanage jwara ide","I have a fever"],["ತಲೆ ನೋವು","Tale novu","Headache"],["ಡಾಕ್ಟರ್ ಎಲ್ಲಿದ್ದಾರೆ?","Doctor elliddare?","Where is the doctor?"],["ಔಷಧಿ ಎಲ್ಲಿ ಸಿಗುತ್ತದೆ?","Aushadhi elli siguttade?","Where can I get medicine?"],["ನೀರು ಬೇಕು","Neeru beku","I need water"]]},
"Workplace":{i:"💼",tip:"Colleagues appreciate even broken Kannada. “Svalpa svalpa” (a little) opens doors.",p:[
["ಸಭೆ ಯಾವಾಗ?","Sabhe yaavaga?","When is the meeting?"],["ದಯವಿಟ್ಟು ಇನ್ನೊಮ್ಮೆ ಹೇಳಿ","Dayavittu innomme heli","Please say that again"],["ನನಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ","Nanage arthavaagalilla","I did not understand"],["ಸ್ವಲ್ಪ ನಿಧಾನವಾಗಿ ಮಾತಾಡಿ","Svalpa nidhaanavaagi maataadi","Speak a little slowly"],["ನನಗೆ ಕನ್ನಡ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಬರುತ್ತದೆ","Nanage Kannada svalpa svalpa baruttade","I know a little Kannada"]]}
};
const $=s=>document.querySelector(s);
let cur="Greetings",mode="learn",done={};
try{done=JSON.parse(localStorage.getItem("kfe")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("kfe",JSON.stringify(done))}catch(e){}};
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang&&x.lang.toLowerCase().startsWith("kn"))||null;
 $("#vn").textContent=voice?"":"Tip: no Kannada voice found on this device, so audio may sound approximate. Install a Kannada text-to-speech voice in your system settings.";}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace("…",""));u.lang="kn-IN";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}
function key(k){return cur+"|"+k}
function chips(){$("#chips").innerHTML=Object.keys(D).map(k=>`<button class="${k==cur?'on':''}" data-c="${k}">${D[k].i} ${k}</button>`).join("");
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cur=b.dataset.c;render()})}
function prog(){const p=D[cur].p,n=p.filter(x=>done[key(x[1])]).length;$("#pb").style.width=(n/p.length*100)+"%";
 $("#pt").textContent=n+" of "+p.length+" phrases learned in "+cur}
function learn(){const s=D[cur];
 $("#learn").innerHTML=`<div class="tip">💡 ${s.tip}</div>`+s.p.map((x,i)=>`<div class="card"><button class="ic" data-s="${i}" aria-label="Listen">🔊</button><div class="t"><div class="k kn">${x[0]}</div><div class="r">${x[1]}</div><div class="e">${x[2]}</div></div><button class="ic ${done[key(x[1])]?'done':''}" data-d="${i}" aria-label="Mark learned">✓</button></div>`).join("");
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>say(s.p[b.dataset.s][0]));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const k=key(s.p[b.dataset.d][1]);done[k]=!done[k];save();render()})}
let Q=[],qi=0,score=0;
function startQuiz(){const all=Object.values(D).flatMap(s=>s.p);
 const pool=D[cur].p.slice().sort(()=>Math.random()-.5).slice(0,5);qi=0;score=0;
 Q=pool.map(p=>{const rev=Math.random()<.5;const wrong=all.filter(a=>a!==p).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[p,...wrong].sort(()=>Math.random()-.5);return{p,rev,opts}});showQ()}
function showQ(){const el=$("#quiz");
 if(qi>=Q.length){el.innerHTML=`<div class="q"><div class="big">${score} / ${Q.length} 🎉</div><p>${score==Q.length?"Perfect! Try another scenario.":"Good effort. Review the phrases and try again."}</p><button class="on" id="again">Play again</button></div>`;$("#again").onclick=startQuiz;return}
 const q=Q[qi];
 el.innerHTML=`<div class="q"><div class="e">Question ${qi+1} of ${Q.length}</div><div class="big ${q.rev?'':'kn'}">${q.rev?q.p[2]:q.p[0]}</div><div class="e">${q.rev?"Pick the Kannada (romanised):":"What does it mean?"}</div>`+
 q.opts.map((o,i)=>`<button class="opt" data-o="${i}">${q.rev?`<span class="kn">${o[0]}</span> · ${o[1]}`:o[2]}</button>`).join("")+`</div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=q.opts[b.dataset.o]===q.p;if(ok)score++;
  document.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(q.opts[i]===q.p)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
  say(q.p[0]);setTimeout(()=>{qi++;showQ()},1400)})}
function render(){chips();prog();$("#tL").className=mode=="learn"?"on":"";$("#tQ").className=mode=="quiz"?"on":"";
 $("#learn").classList.toggle("hide",mode!="learn");$("#quiz").classList.toggle("hide",mode!="quiz");
 if(mode=="learn")learn();else startQuiz()}
$("#tL").onclick=()=>{mode="learn";render()};$("#tQ").onclick=()=>{mode="quiz";render()};
$("#th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#1b1610";r.dataset.theme=d?"light":"dark"};
render();
</script>
</body>
</html>
